name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go test / vet / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build -o /tmp/dbx ./cmd/dbx

  nvim:
    name: Neovim smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: nvim smoke
        run: nvim --headless -u NONE -l tests/nvim_smoke.lua
